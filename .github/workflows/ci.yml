name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Format / Lint / Type-check / Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.10.2"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install project and dev dependencies
        # --frozen ensures the lockfile is up-to-date (fails if stale).
        # --extra dev: pytest, black, ruff, mypy, etc.
        # --extra rag: sqlite-vec and sentence-transformers (from lockfile, no ad-hoc pip install).
        run: uv sync --frozen --extra dev --extra rag

      - name: SCA — audit dependencies for known vulnerabilities
        # pip-audit scans all installed packages against the OSV advisory DB.
        # Exits non-zero (and fails CI) on any unignored finding.
        # To suppress a known-acceptable vuln: --ignore-vuln GHSA-xxxx-yyyy-zzzz
        # --skip-editable: skips the project package itself (no PyPI release to audit).
        run: uvx pip-audit --skip-editable --vulnerability-service osv

      - name: Check formatting (black)
        run: uv run black --check src/

      - name: Lint (ruff)
        run: uv run ruff check src/

      - name: Type-check (mypy)
        run: uv run mypy src/

      - name: Install system audio libraries
        run: sudo apt-get install -y portaudio19-dev libportaudio2

      - name: Run tests with coverage
        # --cov-fail-under=80 enforces the project's 80 % minimum coverage gate.
        run: uv run pytest --cov=src --cov-report=term-missing --cov-fail-under=80

  frontend:
    name: Frontend — Typecheck / Lint / Test / Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build (web bundle)
        # Exercises tsc -b && vite build — the web artifact path.
        # Full Tauri/Rust build (tauri build) is heavier and left as future CI work.
        run: npm run build
